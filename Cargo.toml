[package]
name = "mtgboostersim"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.35"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = { version = "2", features = ["json"] }
